<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Abdullah Shadek Fahim</title>
  <style>
    /* ── Focal Point Modal ── */
    #fp-overlay{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);
      z-index:99999;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
    }
    #fp-overlay.open{display:flex}
    #fp-modal{
      background:#1c1c1e;border-radius:16px;padding:1.4rem;
      max-width:500px;width:94vw;
      box-shadow:0 24px 72px rgba(0,0,0,.7);
      border:1px solid #2e2e2e;
    }
    #fp-modal h3{margin:0 0 .25rem;font-size:.95rem;color:#f2f2f7;font-family:system-ui,sans-serif}
    #fp-modal p{margin:0 0 .9rem;font-size:.76rem;color:#8e8e93;font-family:system-ui,sans-serif}
    #fp-drag-area{
      position:relative;border-radius:10px;overflow:hidden;
      cursor:crosshair;user-select:none;touch-action:none;
      aspect-ratio:4/3;background:#2c2c2e;
    }
    #fp-drag-area img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    #fp-dot{
      position:absolute;width:24px;height:24px;border-radius:50%;
      border:2.5px solid #fff;
      box-shadow:0 0 0 2px #1d5aff,0 2px 10px rgba(0,0,0,.6);
      transform:translate(-50%,-50%);z-index:5;pointer-events:none;
    }
    #fp-footer{display:flex;gap:.7rem;margin-top:.9rem;align-items:center}
    #fp-preview-wrap{width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #3a3a3c;flex-shrink:0}
    #fp-preview-wrap img{width:100%;height:100%;object-fit:cover}
    #fp-pos{font-size:.75rem;color:#8e8e93;font-family:system-ui,sans-serif;margin-top:.2rem}
    #fp-apply{
      margin-left:auto;padding:.5rem 1.15rem;background:#1d5aff;color:#fff;
      border:none;border-radius:8px;font-size:.83rem;font-weight:700;
      cursor:pointer;font-family:system-ui,sans-serif;transition:opacity .15s;
    }
    #fp-apply:hover{opacity:.88}
    #fp-cancel{
      padding:.5rem .9rem;background:transparent;color:#8e8e93;
      border:1px solid #3a3a3c;border-radius:8px;font-size:.83rem;
      cursor:pointer;font-family:system-ui,sans-serif;
    }
    /* Button injected into CMS form */
    .fp-trigger-btn{
      display:inline-flex;align-items:center;gap:.3rem;
      margin:.45rem 0 .3rem;padding:.35rem .8rem;
      background:rgba(29,90,255,.15);color:#6b9fff;
      border:1px solid rgba(29,90,255,.35);border-radius:6px;
      font-size:.75rem;font-weight:600;cursor:pointer;
      font-family:system-ui,sans-serif;transition:all .15s;
    }
    .fp-trigger-btn:hover{background:rgba(29,90,255,.28);color:#a0bfff}
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <!-- Focal Point Drag Modal -->
  <div id="fp-overlay">
    <div id="fp-modal">
      <h3>🎯 Set Focal Point</h3>
      <p>Drag the dot to set the crop focus. Click Apply when done.</p>
      <div id="fp-drag-area">
        <img id="fp-main-img" src="" alt="" crossorigin="anonymous">
        <div id="fp-dot"></div>
      </div>
      <div id="fp-footer">
        <div id="fp-preview-wrap">
          <img id="fp-preview-img" src="" alt="" crossorigin="anonymous">
        </div>
        <div>
          <div style="font-size:.68rem;color:#636366;font-family:system-ui,sans-serif">Round crop preview</div>
          <div id="fp-pos">50%, 50%</div>
        </div>
        <button id="fp-cancel">Cancel</button>
        <button id="fp-apply">✓ Apply</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    /* ── State ── */
    let activeXInput = null, activeYInput = null;
    let curX = 50, curY = 50;
    let isDragging = false;

    /* ── DOM refs ── */
    const overlay  = document.getElementById('fp-overlay');
    const dragArea = document.getElementById('fp-drag-area');
    const dot      = document.getElementById('fp-dot');
    const mainImg  = document.getElementById('fp-main-img');
    const prevImg  = document.getElementById('fp-preview-img');
    const posLabel = document.getElementById('fp-pos');

    /* ── Drag logic ── */
    function setFocal(px, py){
      curX = Math.max(0, Math.min(100, Math.round(px)));
      curY = Math.max(0, Math.min(100, Math.round(py)));
      dot.style.left = curX + '%';
      dot.style.top  = curY + '%';
      prevImg.style.objectPosition = curX + '% ' + curY + '%';
      posLabel.textContent = curX + '%, ' + curY + '%';
    }
    function pctFrom(e){
      const r = dragArea.getBoundingClientRect();
      return {
        x: ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width  * 100,
        y: ((e.touches ? e.touches[0].clientY : e.clientY) - r.top)  / r.height * 100
      };
    }
    dragArea.addEventListener('mousedown',  e=>{ isDragging=true; const p=pctFrom(e); setFocal(p.x,p.y); e.preventDefault(); });
    dragArea.addEventListener('touchstart', e=>{ isDragging=true; const p=pctFrom(e); setFocal(p.x,p.y); e.preventDefault(); },{passive:false});
    window.addEventListener('mousemove',  e=>{ if(isDragging){ const p=pctFrom(e); setFocal(p.x,p.y); }});
    window.addEventListener('touchmove',  e=>{ if(isDragging){ const p=pctFrom(e); setFocal(p.x,p.y); e.preventDefault(); }},{passive:false});
    window.addEventListener('mouseup',  ()=>isDragging=false);
    window.addEventListener('touchend', ()=>isDragging=false);

    /* ── Modal open / close ── */
    function openModal(imgSrc, xIn, yIn){
      activeXInput = xIn;
      activeYInput = yIn;
      mainImg.src  = imgSrc;
      prevImg.src  = imgSrc;
      overlay.classList.add('open');
      const ix = parseFloat(xIn.value) || 50;
      const iy = parseFloat(yIn.value) || 50;
      const apply = () => setFocal(ix, iy);
      if(mainImg.complete && mainImg.naturalWidth) apply();
      else mainImg.onload = apply;
    }
    function closeModal(){ overlay.classList.remove('open'); }
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
    document.getElementById('fp-cancel').addEventListener('click', closeModal);

    /* ── Apply: push values into Sveltia-bound inputs ── */
    function pushToInput(inp, val){
      try{
        const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
        setter.call(inp, val);
      }catch(e){ inp.value = val; }
      inp.dispatchEvent(new Event('input',  {bubbles:true}));
      inp.dispatchEvent(new Event('change', {bubbles:true}));
    }
    document.getElementById('fp-apply').addEventListener('click', ()=>{
      if(activeXInput) pushToInput(activeXInput, curX);
      if(activeYInput) pushToInput(activeYInput, curY);
      closeModal();
    });

    /* ────────────────────────────────────────────────────────
       ROBUST FOCAL INPUT DETECTION
       Instead of matching exact label strings, we scan every
       number input and check if nearby text contains focal/focus
       keywords, then classify X vs Y by axis keywords.
    ──────────────────────────────────────────────────────── */

    // Return lowercase text of the nearest ancestor that mentions focal/focus
    function getFocalContext(inp){
      let el = inp.parentElement;
      for(let i = 0; i < 10; i++){
        if(!el || el === document.body) break;
        const t = el.textContent.toLowerCase();
        if(t.includes('focal') || t.includes('focus')) return t;
        el = el.parentElement;
      }
      return '';
    }

    function findFocalInputPair(){
      const allInputs = [...document.querySelectorAll('input[type="number"]')];
      let xIn = null, yIn = null;

      for(const inp of allInputs){
        const ctx = getFocalContext(inp);
        if(!ctx) continue;

        // X axis: look for x, horizontal, left-right
        const isX = /focal[\s_-]*x\b/.test(ctx) ||
                    /focus[\s_-]*x\b/.test(ctx)  ||
                    /\bhorizontal\b/.test(ctx)    ||
                    (/\bleft\b/.test(ctx) && /\bright\b/.test(ctx));

        // Y axis: look for y, vertical, top-bottom
        const isY = /focal[\s_-]*y\b/.test(ctx) ||
                    /focus[\s_-]*y\b/.test(ctx)  ||
                    /\bvertical\b/.test(ctx)      ||
                    (/\btop\b/.test(ctx) && /\bbottom\b/.test(ctx));

        if(isX && !xIn) xIn = inp;
        else if(isY && !yIn) yIn = inp;
      }

      return {xIn, yIn};
    }

    /* ── Find the best candidate image currently visible in the CMS ── */
    function findImgSrc(){
      const candidates = [];
      for(const img of document.querySelectorAll('img')){
        const s = img.src || '';
        if(!s) continue;
        if(img.naturalWidth < 40 || img.naturalHeight < 40) continue;
        const area = img.naturalWidth * img.naturalHeight;
        // Prefer blob URLs (just-uploaded) and known CDN/repo paths
        const bonus =
          s.startsWith('blob:')               ? 2e8 :
          s.includes('raw.githubusercontent') ? 1e8 :
          s.includes('/uploads/')             ? 1e8 :
          s.includes('/assets/')              ? 5e7 :
          s.includes('netlify')               ? 5e7 : 0;
        if(bonus > 0 || area > 10000) candidates.push({src: s, score: area + bonus});
      }
      if(!candidates.length) return '';
      candidates.sort((a,b) => b.score - a.score);
      return candidates[0].src;
    }

    /* ── Button injection ── */
    const BTN_ID = 'fp-btn-focal';

    function tryInject(){
      if(document.getElementById(BTN_ID)) return; // already present

      const {xIn, yIn} = findFocalInputPair();
      if(!xIn || !yIn) return;

      // Walk up from xIn to find the nearest ancestor that also contains yIn
      let container = xIn.parentElement;
      for(let i = 0; i < 14; i++){
        if(!container || container === document.body) break;
        if(container.contains(yIn)) break;
        container = container.parentElement;
      }
      if(!container || container === document.body) container = xIn.parentElement;

      const btn = document.createElement('button');
      btn.id        = BTN_ID;
      btn.type      = 'button';
      btn.className = 'fp-trigger-btn';
      btn.innerHTML = '🎯 Drag to set focal point';

      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const imgSrc = findImgSrc();
        if(!imgSrc){
          alert('Please upload an image first, then click this button to set the focal point.');
          return;
        }
        openModal(imgSrc, xIn, yIn);
      });

      // Prepend to container
      container.insertBefore(btn, container.firstChild);
    }

    function cleanStale(){
      const btn = document.getElementById(BTN_ID);
      if(!btn) return;
      const {xIn} = findFocalInputPair();
      if(!xIn) btn.remove(); // user navigated away from focal fields
    }

    /* ── Watch CMS DOM mutations ── */
    let debounce = null;
    const observer = new MutationObserver(() => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { cleanStale(); tryInject(); }, 350);
    });
    observer.observe(document.body, {childList: true, subtree: true});

    // Eager attempts in case CMS renders synchronously or fast
    setTimeout(tryInject, 600);
    setTimeout(tryInject, 1800);
    setTimeout(tryInject, 4000);
  })();
  </script>
</body>
</html>
