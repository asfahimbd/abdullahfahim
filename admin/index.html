<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Abdullah Shadek Fahim</title>
  <style>
    /* ── Focal Point Modal ── */
    #fp-overlay{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);
      z-index:99999;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
    }
    #fp-overlay.open{display:flex}
    #fp-modal{
      background:#1c1c1e;border-radius:16px;padding:1.4rem;
      max-width:500px;width:94vw;
      box-shadow:0 24px 72px rgba(0,0,0,.7);
      border:1px solid #2e2e2e;
    }
    #fp-modal h3{margin:0 0 .25rem;font-size:.95rem;color:#f2f2f7;font-family:system-ui,sans-serif}
    #fp-modal p{margin:0 0 .9rem;font-size:.76rem;color:#8e8e93;font-family:system-ui,sans-serif}
    #fp-drag-area{
      position:relative;border-radius:10px;overflow:hidden;
      cursor:crosshair;user-select:none;touch-action:none;
      aspect-ratio:4/3;background:#2c2c2e;
    }
    #fp-drag-area img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    #fp-dot{
      position:absolute;width:24px;height:24px;border-radius:50%;
      border:2.5px solid #fff;
      box-shadow:0 0 0 2px #1d5aff,0 2px 10px rgba(0,0,0,.6);
      transform:translate(-50%,-50%);z-index:5;pointer-events:none;
    }
    #fp-footer{display:flex;gap:.7rem;margin-top:.9rem;align-items:center}
    #fp-preview-wrap{width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #3a3a3c;flex-shrink:0}
    #fp-preview-wrap img{width:100%;height:100%;object-fit:cover}
    #fp-pos{font-size:.75rem;color:#8e8e93;font-family:system-ui,sans-serif;margin-top:.2rem}
    #fp-apply{
      margin-left:auto;padding:.5rem 1.15rem;background:#1d5aff;color:#fff;
      border:none;border-radius:8px;font-size:.83rem;font-weight:700;
      cursor:pointer;font-family:system-ui,sans-serif;transition:opacity .15s;
    }
    #fp-apply:hover{opacity:.88}
    #fp-cancel{
      padding:.5rem .9rem;background:transparent;color:#8e8e93;
      border:1px solid #3a3a3c;border-radius:8px;font-size:.83rem;
      cursor:pointer;font-family:system-ui,sans-serif;
    }
    /* ── Floating button (always visible) ── */
    #fp-float{
      position:fixed;bottom:24px;right:24px;
      width:52px;height:52px;border-radius:50%;
      background:#1d5aff;color:#fff;border:none;
      font-size:24px;cursor:pointer;z-index:9998;
      box-shadow:0 4px 18px rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;
      transition:transform .15s, background .15s;
      font-family:system-ui,sans-serif;
    }
    #fp-float:hover{transform:scale(1.1);background:#3a6fff}
    #fp-float-tip{
      position:fixed;bottom:84px;right:16px;
      background:#1c1c1e;color:#f2f2f7;
      font-size:.72rem;font-family:system-ui,sans-serif;
      padding:.4rem .7rem;border-radius:8px;
      border:1px solid #333;white-space:nowrap;
      pointer-events:none;opacity:0;
      transition:opacity .2s;z-index:9999;
    }
    #fp-float:hover + #fp-float-tip,
    #fp-float-tip.show{opacity:1}
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <!-- Focal Point Drag Modal -->
  <div id="fp-overlay">
    <div id="fp-modal">
      <h3>🎯 Set Focal Point</h3>
      <p>Drag the dot to set where the image is cropped. Click Apply when done.</p>
      <div id="fp-drag-area">
        <img id="fp-main-img" src="" alt="" crossorigin="anonymous">
        <div id="fp-dot"></div>
      </div>
      <div id="fp-footer">
        <div id="fp-preview-wrap">
          <img id="fp-preview-img" src="" alt="" crossorigin="anonymous">
        </div>
        <div>
          <div style="font-size:.68rem;color:#636366;font-family:system-ui,sans-serif">Round crop preview</div>
          <div id="fp-pos">50%, 50%</div>
        </div>
        <button id="fp-cancel">Cancel</button>
        <button id="fp-apply">✓ Apply</button>
      </div>
    </div>
  </div>

  <!-- Floating focal point trigger (always visible) -->
  <button id="fp-float" title="Set Focal Point">🎯</button>
  <div id="fp-float-tip">Set focal point</div>

  <script>
  (function(){
    var curX=50, curY=50, isDragging=false;
    var activeX=null, activeY=null;

    var overlay = document.getElementById('fp-overlay');
    var dragArea= document.getElementById('fp-drag-area');
    var dot     = document.getElementById('fp-dot');
    var mainImg = document.getElementById('fp-main-img');
    var prevImg = document.getElementById('fp-preview-img');
    var posLbl  = document.getElementById('fp-pos');

    /* ── drag ── */
    function setFocal(px,py){
      curX=Math.max(0,Math.min(100,Math.round(px)));
      curY=Math.max(0,Math.min(100,Math.round(py)));
      dot.style.left=curX+'%'; dot.style.top=curY+'%';
      prevImg.style.objectPosition=curX+'% '+curY+'%';
      posLbl.textContent=curX+'%, '+curY+'%';
    }
    function pct(e){
      var r=dragArea.getBoundingClientRect();
      return {
        x:((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*100,
        y:((e.touches?e.touches[0].clientY:e.clientY)-r.top)/r.height*100
      };
    }
    dragArea.addEventListener('mousedown', function(e){isDragging=true;var p=pct(e);setFocal(p.x,p.y);e.preventDefault();});
    dragArea.addEventListener('touchstart',function(e){isDragging=true;var p=pct(e);setFocal(p.x,p.y);e.preventDefault();},{passive:false});
    window.addEventListener('mousemove', function(e){if(isDragging){var p=pct(e);setFocal(p.x,p.y);}});
    window.addEventListener('touchmove', function(e){if(isDragging){var p=pct(e);setFocal(p.x,p.y);e.preventDefault();}},{passive:false});
    window.addEventListener('mouseup',   function(){isDragging=false;});
    window.addEventListener('touchend',  function(){isDragging=false;});

    /* ── modal ── */
    function openModal(src,xIn,yIn){
      activeX=xIn; activeY=yIn;
      mainImg.src=src; prevImg.src=src;
      overlay.classList.add('open');
      var ix=parseFloat(xIn.value)||50, iy=parseFloat(yIn.value)||50;
      if(mainImg.complete&&mainImg.naturalWidth) setFocal(ix,iy);
      else mainImg.onload=function(){setFocal(ix,iy);};
    }
    function closeModal(){overlay.classList.remove('open');}
    overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});
    document.getElementById('fp-cancel').addEventListener('click',closeModal);

    /* ── push value into Sveltia reactive input ── */
    function push(inp,val){
      try{
        var s=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
        s.call(inp,val);
      }catch(e){inp.value=val;}
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      inp.dispatchEvent(new Event('change',{bubbles:true}));
    }
    document.getElementById('fp-apply').addEventListener('click',function(){
      if(activeX) push(activeX,curX);
      if(activeY) push(activeY,curY);
      closeModal();
    });

    /* ────────────────────────────────────────────────
       FIND FOCAL X & Y INPUTS
       Strategy: scan all inputs (number + text with
       numeric hints), classify by nearby label text.
    ──────────────────────────────────────────────── */
    function getClosestLabel(inp){
      // 1. label[for=id]
      if(inp.id){
        var lbl=document.querySelector('label[for="'+inp.id+'"]');
        if(lbl) return lbl.textContent.toLowerCase();
      }
      // 2. aria-label / placeholder
      var al=(inp.getAttribute('aria-label')||inp.placeholder||'').toLowerCase();
      if(al) return al;
      // 3. Walk up to find first label or heading
      var el=inp.parentElement;
      for(var i=0;i<6;i++){
        if(!el||el===document.body) break;
        var lbl2=el.querySelector('label');
        if(lbl2&&!lbl2.contains(inp)) return lbl2.textContent.toLowerCase();
        // text node in direct parent
        var cn=el.childNodes;
        for(var j=0;j<cn.length;j++){
          if(cn[j].nodeType===3&&cn[j].textContent.trim()) return cn[j].textContent.toLowerCase();
        }
        el=el.parentElement;
      }
      return '';
    }

    function hasFocalAncestor(inp){
      var el=inp.parentElement;
      for(var i=0;i<12;i++){
        if(!el||el===document.body) break;
        var t=el.textContent.toLowerCase();
        if(t.includes('focal')||t.includes('focus')) return true;
        el=el.parentElement;
      }
      return false;
    }

    function findPair(){
      // Try all inputs: number first, then text
      var all=[].concat(
        Array.from(document.querySelectorAll('input[type="number"]')),
        Array.from(document.querySelectorAll('input[type="text"]'))
      );
      var xIn=null, yIn=null;

      for(var i=0;i<all.length;i++){
        var inp=all[i];
        if(!hasFocalAncestor(inp)) continue;
        var lbl=getClosestLabel(inp);

        var isX=/focal[\s_-]*x\b|focus[\s_-]*x\b|horizontal|\bleft\b.*\bright\b|image focal x|photo focus x/.test(lbl);
        var isY=/focal[\s_-]*y\b|focus[\s_-]*y\b|vertical|\btop\b.*\bbottom\b|image focal y|photo focus y/.test(lbl);

        if(isX&&!xIn) xIn=inp;
        else if(isY&&!yIn) yIn=inp;
        if(xIn&&yIn) break;
      }

      // Fallback: if we can't match by label, just take the first two focal-context inputs in order
      if(!xIn||!yIn){
        var focalInputs=all.filter(function(inp){ return hasFocalAncestor(inp); });
        if(focalInputs.length>=2){
          xIn=focalInputs[0]; yIn=focalInputs[1];
        }
      }

      return {xIn:xIn, yIn:yIn};
    }

    /* ── Find best image currently visible in CMS ── */
    function findImg(){
      var best=null, bestScore=0;
      var imgs=document.querySelectorAll('img');
      for(var i=0;i<imgs.length;i++){
        var img=imgs[i], s=img.src||'';
        if(!s||img.naturalWidth<40||img.naturalHeight<40) continue;
        var area=img.naturalWidth*img.naturalHeight;
        var bonus=s.startsWith('blob:')?2e8:
                  s.includes('raw.githubusercontent')?1e8:
                  s.includes('/uploads/')?1e8:
                  s.includes('/assets/')?5e7:0;
        var score=area+bonus;
        if(score>bestScore){bestScore=score;best=s;}
      }
      return best||'';
    }

    /* ── Floating button click ── */
    document.getElementById('fp-float').addEventListener('click',function(e){
      e.preventDefault();
      var pair=findPair();
      if(!pair.xIn||!pair.yIn){
        alert('Focal point fields not found on this page.\n\nPlease open a Portfolio Item (click "Edit" on an item) and try again.');
        return;
      }
      var img=findImg();
      if(!img){
        alert('No image found yet.\nPlease upload a Featured Image for this item first, then click 🎯 again.');
        return;
      }
      openModal(img, pair.xIn, pair.yIn);
    });

    /* ── Also try inline injection next to the X field ── */
    var BTN='fp-inline-btn';
    function tryInline(){
      if(document.getElementById(BTN)) return;
      var pair=findPair();
      if(!pair.xIn||!pair.yIn) return;

      var container=pair.xIn.parentElement;
      for(var i=0;i<14;i++){
        if(!container||container===document.body) break;
        if(container.contains(pair.yIn)) break;
        container=container.parentElement;
      }
      if(!container||container===document.body) container=pair.xIn.parentElement;

      var btn=document.createElement('button');
      btn.id=BTN; btn.type='button';
      btn.textContent='🎯 Set focal point';
      btn.style.cssText='display:inline-flex;align-items:center;gap:.3rem;'+
        'margin:.4rem 0 .3rem;padding:.3rem .75rem;'+
        'background:rgba(29,90,255,.15);color:#6b9fff;'+
        'border:1px solid rgba(29,90,255,.35);border-radius:6px;'+
        'font-size:.75rem;font-weight:600;cursor:pointer;'+
        'font-family:system-ui,sans-serif;';
      btn.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var img=findImg();
        if(!img){alert('Please upload an image first.');return;}
        openModal(img,pair.xIn,pair.yIn);
      });
      container.insertBefore(btn,container.firstChild);
    }
    function cleanInline(){
      var btn=document.getElementById(BTN);
      if(btn&&!findPair().xIn) btn.remove();
    }

    var timer=null;
    var obs=new MutationObserver(function(){
      clearTimeout(timer);
      timer=setTimeout(function(){cleanInline();tryInline();},350);
    });
    obs.observe(document.body,{childList:true,subtree:true});

    setTimeout(tryInline,700);
    setTimeout(tryInline,2000);
    setTimeout(tryInline,4500);
  })();
  </script>
</body>
</html>
