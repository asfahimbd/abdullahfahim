backend:
  name: github
  repo: asfahimbd/abdullahfahim
  branch: main
  base_url: https://oauth-proxy.asfahimbd.workers.dev   # your Cloudflare auth worker

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  # ════════════════════════════════════════
  #   SETTINGS
  # ════════════════════════════════════════
  - name: "settings"
    label: "⚙️ Settings"
    files:

      - name: "hero"
        label: "Profile & Site Settings"
        file: "content/settings/hero.md"
        fields:
          - { label: "Full Name",        name: "name",            widget: "string" }
          - { label: "Tagline",          name: "tagline",         widget: "string",  required: false }
          - { label: "Bio",              name: "bio",             widget: "text",    required: false }
          - { label: "Profile Photo",    name: "photo",           widget: "image",   required: false }
          - { label: "Email",            name: "email",           widget: "string",  required: false }
          - { label: "GitHub URL",       name: "github",          widget: "string",  required: false }
          - { label: "LinkedIn URL",     name: "linkedin",        widget: "string",  required: false }
          - { label: "ORCID",            name: "orcid",           widget: "string",  required: false }
          - { label: "Facebook URL",     name: "facebook",        widget: "string",  required: false }
          - { label: "YouTube Channel",  name: "youtube_channel", widget: "string",  required: false }
          - { label: "Resume URL",       name: "resume",          widget: "string",  required: false }
          - label: "CV File (Upload)"
            name: "cv_file"
            widget: "image"
            required: false
            hint: "Uploaded file takes priority over Resume URL above."
          - label: "🔒 Screenshot Protection"
            name: "screenshot_protection"
            widget: "boolean"
            default: false
            hint: >
              Enables sitewide protection: blocks right-click, text selection,
              Ctrl+S (save), Ctrl+U (view source), Ctrl+P (print), F12 (DevTools),
              and image drag. Note: cannot block external screen recorders.

      - name: "nav_visibility"
        label: "Navigation Visibility"
        file: "content/settings/nav_visibility.md"
        fields:
          - { label: "Show Publications",         name: "Publications",   widget: "boolean", default: true }
          - { label: "Show Research",             name: "Research",       widget: "boolean", default: true }
          - { label: "Show Projects",             name: "Projects",       widget: "boolean", default: true }
          - { label: "Show Experiences",          name: "Experiences",    widget: "boolean", default: true }
          - { label: "Show Training & Field Work",name: "Training",       widget: "boolean", default: true }
          - { label: "Show Certificates",         name: "Certificates",   widget: "boolean", default: true }
          - { label: "Show Technical Talk",       name: "TechnicalTalk",  widget: "boolean", default: true }
          - { label: "Show Achievements",         name: "Achievements",   widget: "boolean", default: true }
          - { label: "Show My Design",            name: "MyDesign",       widget: "boolean", default: true }
          - { label: "Show Education",            name: "Education",      widget: "boolean", default: true }

      - name: "footer"
        label: "Footer"
        file: "content/settings/footer.md"
        fields:
          - { label: "Footer Copyright Text", name: "footer_text", widget: "string", required: false }


  # ════════════════════════════════════════
  #   PUBLICATIONS
  # ════════════════════════════════════════
  - name: "publications"
    label: "📄 Publications"
    folder: "content/publications"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Type"
        name: "pub_type"
        widget: "select"
        options: ["Journal", "Conference", "Thesis"]
        default: "Journal"
      - label: "Status"
        name: "status"
        widget: "select"
        required: false
        options: ["Published", "Accepted", "Under Review", "In Preparation", "Preprint"]
        default: "Published"
      - { label: "Date",         name: "date",  widget: "string", required: false, hint: "e.g. 2024-06-15 or April 2024" }
      - { label: "Venue / Journal Name", name: "venue", widget: "string", required: false }
      - { label: "DOI",          name: "doi",   widget: "string", required: false }
      - { label: "Link / URL",   name: "link",  widget: "string", required: false }
      - { label: "Brief Abstract", name: "brief_abstract", widget: "text", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Authors"
        name: "authors"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - label: "Role"
            name: "role"
            widget: "select"
            required: false
            options: ["", "corresponding", "equal"]
            default: ""
      - label: "Research Interests"
        name: "research_interests"
        widget: "list"
        required: false
        fields:
          - { label: "Interest", name: "interest", widget: "string" }
      - { label: "PDF File",   name: "pdf_file",   widget: "image",  required: false }
      - { label: "PDF Title",  name: "pdf_title",  widget: "string", required: false }
      - { label: "Pinned (show at top)", name: "pinned", widget: "boolean", default: false }
      - label: "🙈 Hidden — Hide from site"
        name: "hidden"
        widget: "boolean"
        default: false
        hint: "Completely hides this publication from the public site. Still editable in CMS."
      - label: "🚫 Hide Abstract"
        name: "hide_abstract"
        widget: "boolean"
        default: false
        hint: "Shows the publication card (title, status) but hides abstract and full body. Useful while under review."
      - label: "🔒 Private Note (CMS only)"
        name: "private_note"
        widget: "text"
        required: false
        hint: "Internal notes — never displayed on the public site."
      - { label: "Full Content / Notes", name: "body", widget: "markdown", required: false }


  # ════════════════════════════════════════
  #   PROJECTS, CERTIFICATES, AWARDS, etc.
  # ════════════════════════════════════════
  - name: "projects"
    label: "🗂️ Projects & More"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Undergraduate Thesis"
          - "Academic Project"
          - "Non-Academic Project"
          - "Training"
          - "Field Work"
          - "Certificate"
          - "Session"
          - "Technical Talk"
          - "Award"
          - "Achievement"
        default: "Academic Project"
      - label: "Custom Category (optional override)"
        name: "custom_category"
        widget: "string"
        required: false
        hint: "If set, this replaces the Category on the site (useful for dynamic categories)."
      - { label: "Date", name: "date", widget: "string", required: false, hint: "e.g. 2024-06-15 or June 2024" }
      - { label: "Issuer / Organization", name: "issuer",       widget: "string", required: false }
      - { label: "Issuer Label",          name: "issuer_label", widget: "string", required: false, hint: "e.g. 'Organized by'. Leave blank for default." }
      - { label: "Description",           name: "description",  widget: "text",   required: false }
      - { label: "Featured Image",        name: "image",        widget: "image",  required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Link / URL",   name: "link",     widget: "string", required: false }
      - { label: "YouTube URL",  name: "youtube",  widget: "string", required: false }
      - { label: "PDF File",     name: "pdf_file", widget: "image",  required: false }
      - { label: "PDF Title",    name: "pdf_title",widget: "string", required: false }
      - label: "Research Interests"
        name: "research_interests"
        widget: "list"
        required: false
        fields:
          - { label: "Interest", name: "interest", widget: "string" }
      - { label: "Pinned (show at top)", name: "pinned", widget: "boolean", default: false }
      - label: "🙈 Hidden — Hide from site"
        name: "hidden"
        widget: "boolean"
        default: false
        hint: "Completely hides this item from the public site. Still editable in CMS."
      - label: "🚫 Hide Description"
        name: "hide_description"
        widget: "boolean"
        default: false
        hint: "Shows the card (title, image) but hides description and full body content."
      - label: "🔒 Private Note (CMS only)"
        name: "private_note"
        widget: "text"
        required: false
        hint: "Internal notes — never displayed on the public site."
      - { label: "Full Content / Body", name: "body", widget: "markdown", required: false }


  # ════════════════════════════════════════
  #   EXPERIENCES
  # ════════════════════════════════════════
  - name: "experiences"
    label: "💼 Experiences"
    folder: "content/experiences"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Organization",  name: "organization", widget: "string" }
      - { label: "Logo",          name: "logo",         widget: "image",  required: false }
      - { label: "Location",      name: "location",     widget: "string", required: false }
      - { label: "Website",       name: "website",      widget: "string", required: false }
      - { label: "YouTube URL",   name: "youtube",      widget: "string", required: false }
      - { label: "YouTube Title", name: "youtube_title",widget: "string", required: false }
      # ── Single Role ────────────────────
      - label: "Role / Title"
        name: "role"
        widget: "string"
        required: false
        hint: "For a single role. Leave blank if using Multiple Roles below."
      - label: "Employment Type"
        name: "employment_type"
        widget: "select"
        required: false
        options: ["Full Time", "Part Time", "Voluntary", "Internship", "Research", "Other"]
        default: "Full Time"
      - { label: "Start Date", name: "start_date", widget: "string", required: false, hint: "e.g. January 2023" }
      - { label: "End Date",   name: "end_date",   widget: "string", required: false, hint: "Leave blank or write 'Present' if current." }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Show excerpt on card", name: "show_excerpt", widget: "boolean", default: false }
      - { label: "Certificate", name: "certificate", widget: "image", required: false }
      # ── Multiple Roles (promotions) ────
      - label: "Multiple Roles (for promotions at same org)"
        name: "roles"
        widget: "list"
        required: false
        hint: "Use this when you had multiple roles/promotions at the same organization. Leave empty for single role above."
        fields:
          - { label: "Role Title", name: "role", widget: "string" }
          - label: "Employment Type"
            name: "employment_type"
            widget: "select"
            options: ["Full Time", "Part Time", "Voluntary", "Internship", "Research", "Other"]
            default: "Full Time"
          - { label: "Start Date", name: "start_date", widget: "string" }
          - { label: "End Date",   name: "end_date",   widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
      # ── Media & Extras ─────────────────
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "PDF File",  name: "pdf_file",  widget: "image",  required: false }
      - { label: "PDF Title", name: "pdf_title", widget: "string", required: false }
      - label: "🙈 Hidden — Hide from site"
        name: "hidden"
        widget: "boolean"
        default: false
        hint: "Completely hides this experience from the public site."
      - label: "🔒 Private Note (CMS only)"
        name: "private_note"
        widget: "text"
        required: false
        hint: "Internal notes — never displayed on the public site."
      - { label: "Full Content / Body", name: "body", widget: "markdown", required: false }


  # ════════════════════════════════════════
  #   MY DESIGN
  # ════════════════════════════════════════
  - name: "designs"
    label: "🎨 My Design"
    folder: "content/designs"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Flyer", "Banner", "T-shirt", "Book", "Prospectus", "Booklet", "Proceedings", "Video"]
        default: "Flyer"
      - { label: "Date",          name: "date",        widget: "string", required: false, hint: "e.g. 2024-03-15" }
      - { label: "Cover Image",   name: "cover_image", widget: "image",  required: false }
      - { label: "Description",   name: "description", widget: "text",   required: false }
      - { label: "Issuer / Organization", name: "issuer",       widget: "string", required: false }
      - { label: "Issuer Label",          name: "issuer_label", widget: "string", required: false, hint: "e.g. 'Organized by'. Leave blank for default." }
      - { label: "YouTube URL",   name: "youtube", widget: "string", required: false }
      - { label: "Link / URL",    name: "link",    widget: "string", required: false }
      - { label: "Pinned (show at top)", name: "pinned", widget: "boolean", default: false }
      - label: "🙈 Hidden — Hide from site"
        name: "hidden"
        widget: "boolean"
        default: false
        hint: "Completely hides this design from the public site."
      - label: "🔒 Private Note (CMS only)"
        name: "private_note"
        widget: "text"
        required: false
        hint: "Internal notes — never displayed on the public site."
      - { label: "Body / Notes", name: "body", widget: "markdown", required: false }


  # ════════════════════════════════════════
  #   EDUCATION
  # ════════════════════════════════════════
  - name: "education"
    label: "🎓 Education"
    folder: "content/education"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Level"
        name: "level"
        widget: "select"
        options: ["BSc", "MSc", "PhD", "HSC", "SSC", "Diploma", "Certificate", "Other"]
        default: "BSc"
      - { label: "Institution",          name: "institution", widget: "string" }
      - { label: "Degree / Program",     name: "degree",      widget: "string",  required: false }
      - { label: "Passing Year / Date",  name: "passing",     widget: "string",  required: false, hint: "e.g. 01 January, 2025 or 2025" }
      - { label: "GPA / CGPA",          name: "gpa",         widget: "string",  required: false }
      - { label: "Rank / Position",      name: "rank",        widget: "string",  required: false }
      - { label: "Location",             name: "location",    widget: "string",  required: false }
      - { label: "Website",              name: "website",     widget: "string",  required: false }
      - { label: "Icon (emoji)",         name: "icon",        widget: "string",  default: "🎓", required: false }
      - { label: "Icon Background",      name: "icon_bg",     widget: "string",  default: "var(--blue-l)", required: false }
      - { label: "Logo (small, for card)", name: "logo",      widget: "image",   required: false }
      - { label: "Photo (large, for modal)", name: "photo",   widget: "image",   required: false }
      - { label: "Certificate",          name: "certificate", widget: "image",   required: false }
      - { label: "Transcript",           name: "transcript",  widget: "image",   required: false }
      - { label: "Description",          name: "description", widget: "text",    required: false }
      - { label: "Subjects / Courses",   name: "subjects",    widget: "text",    required: false }
      - { label: "YouTube URL",          name: "youtube",          widget: "string", required: false }
      - { label: "YouTube Title",        name: "youtube_title",    widget: "string", required: false }
      - { label: "Display Order",        name: "order",       widget: "number",  default: 99, hint: "Lower = shown first" }


  # ════════════════════════════════════════
  #   RESEARCH INTERESTS
  # ════════════════════════════════════════
  - name: "interests"
    label: "🔬 Research Interests"
    folder: "content/interests"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Interest Name", name: "name",        widget: "string" }
      - { label: "Description",   name: "description", widget: "text",   required: false }
      - { label: "Display Order", name: "order",       widget: "number", default: 99, hint: "Lower = shown first" }


  # ════════════════════════════════════════
  #   CUSTOM CATEGORIES
  # ════════════════════════════════════════
  - name: "categories"
    label: "📁 Custom Categories"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Category Name", name: "name", widget: "string" }
      - { label: "Icon (emoji)",  name: "icon", widget: "string", default: "📌" }
      - label: "Parent Group"
        name: "parent_group"
        widget: "select"
        default: "Standalone"
        options: ["Standalone", "Projects", "Training", "Certificates", "TechnicalTalk", "Achievements"]
        hint: "'Standalone' creates a new top-level nav section."
